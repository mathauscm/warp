# Builds WarpOss for Apple Silicon and publishes WarpOss-<tag>-arm64.dmg as a
# GitHub Release whenever a version tag is pushed:
#
#   git tag v0.2 && git push origin v0.2
#
# It can also be started by hand from the Actions tab for an existing tag.
# The app is ad-hoc signed (no Apple Developer ID), so macOS asks each user to
# allow it once; the release notes explain how.
name: Build DMG

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1)"
        required: true

permissions:
  contents: write

concurrency:
  group: build-dmg-${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build WarpOss.dmg (Apple Silicon)
    runs-on: macos-26
    timeout-minutes: 360
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.TAG }}

      - name: Fetch Git LFS objects
        run: |
          git lfs install --local
          git lfs pull

      # The release build needs ~15 GB; drop simulators and extra Xcodes the
      # runner image ships with.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf ~/Library/Developer/CoreSimulator /Library/Developer/CoreSimulator/Profiles/Runtimes || true
          df -h /

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: build-dmg-arm64

      - name: Install build dependencies
        run: |
          ./script/install_cargo_release_deps
          ./script/install_cargo_bundle
          brew install protobuf create-dmg
          rustup target add aarch64-apple-darwin

      - name: Build WarpOss.app and WarpOss.dmg
        run: ./script/bundle --channel oss --arch aarch64 --selfsign

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="WarpOss-${TAG}-arm64.dmg"
          cp target/release-lto/bundle/osx/WarpOss.dmg "$DMG"
          cat > notes.md <<'EOF'
          WarpOss para Mac com chip Apple (M1 ou mais novo).

          **Como instalar**
          1. Baixe o `.dmg` abaixo, abra e arraste o **WarpOss** para **Aplicativos**.
          2. O app não é assinado pela Apple, então o macOS bloqueia a primeira abertura.
             Libere uma vez com **um** destes jeitos:
             - Tente abrir o app, vá em **Ajustes do Sistema → Privacidade e Segurança** e clique em **Abrir Mesmo Assim**; ou
             - No Terminal: `xattr -dr com.apple.quarantine /Applications/WarpOss.app`
          3. Pronto: dali em diante ele abre normalmente.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
          else
            gh release create "$TAG" "$DMG" --title "WarpOss $TAG" --notes-file notes.md
          fi
